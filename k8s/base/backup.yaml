# Respaldo diario de la base (3:00 a. m. hora de Bogota). Guarda los ultimos 7 en su propio disco.
# Para bajar uno a tu PC, ver k8s/README.md (seccion "Respaldos").
# El historial clinico viaja cifrado dentro del respaldo (AES-256-GCM), igual que en la base.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: respaldos
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: respaldo-mariadb
spec:
  schedule: "0 3 * * *"
  timeZone: America/Bogota
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app.kubernetes.io/name: respaldo, app.kubernetes.io/part-of: playfit, playfit/tier: backup }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: respaldo
              image: mariadb:11.8
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  archivo="/respaldos/playfit-$(date +%Y%m%d-%H%M).sql.gz"
                  mariadb-dump -h "$DB_HOST" -u "$DB_USER" --single-transaction --routines "$DB_NAME" | gzip > "$archivo"
                  echo "respaldo creado: $archivo"
                  ls -1t /respaldos/playfit-*.sql.gz | tail -n +8 | xargs -r rm --
              env:
                - name: DB_HOST
                  valueFrom: { configMapKeyRef: { name: playfit-config, key: DB_HOST } }
                - name: DB_NAME
                  valueFrom: { configMapKeyRef: { name: playfit-config, key: DB_NAME } }
                - name: DB_USER
                  valueFrom: { configMapKeyRef: { name: playfit-config, key: DB_USER } }
                - name: MYSQL_PWD
                  valueFrom: { secretKeyRef: { name: playfit-secrets, key: DB_PASS } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: respaldos, mountPath: /respaldos }
          volumes:
            - name: respaldos
              persistentVolumeClaim: { claimName: respaldos }
