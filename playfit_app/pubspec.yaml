name: playfit_app
description: PlayFit - app movil de gamificacion social para la adherencia al gimnasio.
publish_to: 'none'
version: 0.6.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: '>=1.2.0'
  flutter_secure_storage: '>=9.2.0'
  shared_preferences: '>=2.3.0'
  google_fonts: '>=6.2.0'
  flutter_svg: '>=2.0.0'
  url_launcher: '>=6.3.0'
  youtube_player_iframe: '>=6.0.2'
  camera: '>=0.11.0'
  google_mlkit_commons: '>=0.11.0'
  google_mlkit_pose_detection: '>=0.14.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/mascota/
