# Configuracion NO secreta (los secretos van en el Secret "playfit-secrets", generado desde secrets.env)
apiVersion: v1
kind: ConfigMap
metadata:
  name: playfit-config
data:
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_NAME: playfit
  DB_USER: playfit_app
  APP_TZ: America/Bogota
  SERVICE_HOST: 0.0.0.0
  TRUST_PROXY: uniquelocal
  AUTH_PORT: "3001"
  CLINICAL_PORT: "3002"
  SOCIAL_PORT: "3003"
  CONTENT_PORT: "3004"
  AUTH_URL: http://auth:3001
  CLINICAL_URL: http://clinical:3002
  SOCIAL_URL: http://social:3003
  CONTENT_URL: http://content:3004
  GATEWAY_HOST: 0.0.0.0
  GATEWAY_PORT: "3000"
  GATEWAY_TRUST_PROXY: "0"
  RATE_LIMIT_GLOBAL: "300"
  RATE_LIMIT_AUTH: "10"
  CORS_ORIGINS: ""
  GEMINI_MODEL: gemini-3.1-flash-lite
  IA_LIMITE_DIARIO: "20"
  # Fase 13: eventos hacia n8n (si el flujo no esta activo, el backend usa su respaldo) y envio de push cada 10 s
  N8N_WEBHOOK_URL: http://n8n:5678/webhook
  PUSH_INTERVALO_SEG: "10"
  # Fase 14: PlayFit Premium y pagos con Wompi en SANDBOX (las llaves secretas van en secrets.env)
  IA_LIMITE_PREMIUM: "100"
  PREMIUM_PRECIO_COP: "9900"
  WOMPI_ENV: sandbox
  WOMPI_PUBLIC_KEY: ""          # pub_test_... (no es secreta); ponla en el overlay
  WOMPI_REDIRECT_URL: ""        # https://TU-DOMINIO/api/social/payments/wompi/return (lo pone el overlay de Azure)
