# MariaDB (SQL relacional) dentro del cluster, con disco persistente: los datos sobreviven a reinicios,
# a "az aks stop/start" y a cambios de version de la app.
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/part-of: playfit }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mariadb }
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/part-of: playfit }
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mariadb }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/part-of: playfit }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # usuario "mysql" de la imagen oficial
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mariadb
          image: mariadb:11.8
          env:
            - name: MARIADB_DATABASE
              valueFrom: { configMapKeyRef: { name: playfit-config, key: DB_NAME } }
            - name: MARIADB_USER
              valueFrom: { configMapKeyRef: { name: playfit-config, key: DB_USER } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: playfit-secrets, key: DB_PASS } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: playfit-secrets, key: MARIADB_ROOT_PASSWORD } }
            - name: TZ
              value: UTC
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["healthcheck.sh", "--connect"] }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
