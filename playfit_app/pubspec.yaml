name: playfit_app
description: PlayFit - app movil de gamificacion social para la adherencia al gimnasio.
publish_to: 'none'
version: 0.7.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: '>=1.2.0'
  flutter_secure_storage: '>=9.2.0'
  shared_preferences: '>=2.3.0'
  google_fonts: '>=6.2.0'
  flutter_svg: '>=2.0.0'
  url_launcher: '>=6.3.0'
  qr_flutter: '>=4.1.0'
  youtube_player_iframe: '>=6.0.2'
  camera: '>=0.11.0'
  google_mlkit_commons: '>=0.11.0'
  google_mlkit_pose_detection: '>=0.14.0'
  # Fase 13: notificaciones push (Firebase Cloud Messaging) y voz del asistente (gratis, en el celular)
  firebase_core: '>=3.6.0'
  firebase_messaging: '>=15.1.0'
  speech_to_text: '>=7.0.0'
  flutter_tts: '>=4.0.2'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/mascota/
