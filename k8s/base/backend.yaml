apiVersion: apps/v1
kind: Deployment
metadata:
  name: social
  labels: { app.kubernetes.io/name: social, app.kubernetes.io/part-of: playfit, playfit/tier: service }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: social }
  template:
    metadata:
      labels: { app.kubernetes.io/name: social, app.kubernetes.io/part-of: playfit, playfit/tier: service }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Antes de arrancar: espera a MariaDB, crea el esquema si la base esta vacia y aplica migraciones.
        # Es idempotente y usa un candado, asi que correrlo en cada pod no borra ni duplica nada.
        - name: db-init
          image: playfit-backend
          command: ["node", "scripts/db-init.js"]
          envFrom:
            - configMapRef: { name: playfit-config }
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: DB_PASS
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: DEMO_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: social
          image: playfit-backend
          command: ["node", "services/social-service/src/server.js"]
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef: { name: playfit-config }
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: DB_PASS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: JWT_SECRET
            # Fase 14: pagos con Wompi (sandbox). Sin estas llaves el resto funciona y el enlace de pago avisa que falta configurarlo.
            - name: WOMPI_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: WOMPI_PRIVATE_KEY
                  optional: true
            - name: WOMPI_EVENTS_SECRET
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: WOMPI_EVENTS_SECRET
                  optional: true
            # Fase 13: push con Firebase (opcional) y token de la API interna para n8n (opcional)
            - name: FCM_SERVICE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: FCM_SERVICE_ACCOUNT
                  optional: true
            - name: N8N_TOKEN
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: N8N_TOKEN
                  optional: true
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 80Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
