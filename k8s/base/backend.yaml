# Gateway + 4 microservicios. Todos usan la MISMA imagen (playfit-backend) con un comando distinto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels: { app.kubernetes.io/name: auth, app.kubernetes.io/part-of: playfit, playfit/tier: service }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: auth }
  template:
    metadata:
      labels: { app.kubernetes.io/name: auth, app.kubernetes.io/part-of: playfit, playfit/tier: service }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Antes de arrancar: espera a MariaDB, crea el esquema si la base esta vacia y aplica migraciones.
        # Es idempotente y usa un candado, asi que correrlo en cada pod no borra ni duplica nada.
        - name: db-init
          image: playfit-backend
          command: ["node", "scripts/db-init.js"]
          envFrom:
            - configMapRef: { name: playfit-config }
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: DB_PASS
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: DEMO_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: auth
          image: playfit-backend
          command: ["node", "services/auth-service/src/server.js"]
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef: { name: playfit-config }
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: DB_PASS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: JWT_SECRET
            # Correo (recuperacion de contrasena) por Brevo. Opcionales: sin ellos el codigo solo se imprime en el log del pod.
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: BREVO_API_KEY
                  optional: true
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: MAIL_FROM
                  optional: true
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 80Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels: { app.kubernetes.io/name: auth, app.kubernetes.io/part-of: playfit }
spec:
  selector: { app.kubernetes.io/name: auth }
  ports:
    - name: http
      port: 3001
      targetPort: http
