# n8n (automatizaciones, self-hosted y gratis) dentro del cluster. Fase 13.
# - NO se publica a internet: el editor se abre con  kubectl port-forward -n playfit svc/n8n 5678:5678
#   y luego http://localhost:5678 (ver k8s/n8n/README.md).
# - Habla con el backend solo por la API interna del social-service (http://social:3003/internal) con N8N_TOKEN.
# - El backend le avisa eventos (p. ej. una conversacion transferida a Soporte) en http://n8n:5678/webhook/...
# - Guarda flujos y credenciales en su propio disco (SQLite); N8N_ENCRYPTION_KEY cifra esas credenciales.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-datos
  labels: { app.kubernetes.io/name: n8n, app.kubernetes.io/part-of: playfit }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels: { app.kubernetes.io/name: n8n, app.kubernetes.io/part-of: playfit, playfit/tier: automatizacion }
spec:
  replicas: 1
  strategy: { type: Recreate }   # el disco es ReadWriteOnce: no puede haber dos pods a la vez
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: n8n }
  template:
    metadata:
      labels: { app.kubernetes.io/name: n8n, app.kubernetes.io/part-of: playfit, playfit/tier: automatizacion }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # usuario "node" de la imagen oficial
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: n8n
          image: n8nio/n8n:1.123.5
          ports:
            - name: http
              containerPort: 5678
          env:
            - { name: GENERIC_TIMEZONE, value: America/Bogota }
            - { name: TZ, value: America/Bogota }
            - { name: N8N_PORT, value: "5678" }
            - { name: N8N_PROTOCOL, value: http }
            - { name: WEBHOOK_URL, value: "http://n8n:5678/" }
            - { name: N8N_SECURE_COOKIE, value: "false" }          # el editor se usa por port-forward (http://localhost)
            - { name: N8N_DIAGNOSTICS_ENABLED, value: "false" }    # sin telemetria
            - { name: N8N_PERSONALIZATION_ENABLED, value: "false" }
            - { name: N8N_VERSION_NOTIFICATIONS_ENABLED, value: "false" }
            - { name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS, value: "true" }
            - { name: N8N_BLOCK_ENV_ACCESS_IN_NODE, value: "false" } # los flujos leen PLAYFIT_* con $env
            - { name: N8N_RUNNERS_ENABLED, value: "true" }         # los nodos Code corren aislados (recomendado)
            - { name: DB_SQLITE_POOL_SIZE, value: "2" }
            - { name: N8N_GIT_NODE_DISABLE_BARE_REPOS, value: "true" }
            - { name: EXECUTIONS_DATA_PRUNE, value: "true" }       # borra ejecuciones viejas (disco pequeno)
            - { name: EXECUTIONS_DATA_MAX_AGE, value: "168" }
            - { name: PLAYFIT_API_URL, value: "http://social:3003/internal" }
            - name: PLAYFIT_N8N_TOKEN
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: N8N_TOKEN
                  optional: true
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: playfit-secrets
                  key: N8N_ENCRYPTION_KEY
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 200Mi }
            limits: { memory: 600Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: datos, mountPath: /home/node/.n8n }
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: n8n-datos
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  labels: { app.kubernetes.io/name: n8n, app.kubernetes.io/part-of: playfit }
spec:
  selector: { app.kubernetes.io/name: n8n }
  ports:
    - name: http
      port: 5678
      targetPort: http
